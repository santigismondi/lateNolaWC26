<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panini FIFA WC26 Album</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="icon" type="image/png" href="./resources/FIFA-2026-World-Cup-Logo-75.png">
</head>

<body class="mode-pegadas">

  <header>
    <div class="theme-switch-wrapper">
      <i class="fa-solid fa-sun theme-icon" id="icon-light"></i>
      <label class="theme-switch" for="checkbox">
        <input type="checkbox" id="checkbox" />
        <div class="slider round"></div>
      </label>
      <i class="fa-solid fa-moon theme-icon" id="icon-dark"></i>
    </div>

    <div class="header-img">
      <img src="./resources/FIFA-2026-World-Cup-Logo-75.png" alt="Logo Panini FIFA WC26" id="logo-img"
        onerror="this.style.display='none'">
    </div>

    <div class="header-top">
      <h1>Panini WC26</h1>
    </div>
    
    <div class="tabs">
      <div class="tab active" data-mode="pegadas">Pegadas</div>
      <div class="tab" data-mode="repetidas">Repetidas</div>
      <div class="tab" data-mode="estadisticas">Stats</div>
    </div>
  </header>

  <main class="container" id="app-container">
    </main>

  <main class="container hidden" id="stats-container">
    </main>

  <footer class="footer-stats" id="footer-pegadas">
    <div class="stats-text">
      <span id="text-pegadas">Pegadas: 0 / 0</span>
      <span id="text-faltan">Faltan: 0</span>
      <span id="text-porcentaje">0%</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </footer>

  <footer class="footer-stats hidden" id="footer-repetidas">
    <div class="stats-text" style="align-items: center;">
      <span id="text-total-repetidas" style="color: var(--panini-orange);">Total Repetidas: 0</span>
      <button id="btn-export-repetidas" class="export-btn" aria-label="Copiar Repetidas">
        <i class="fa-solid fa-copy"></i> Copiar
      </button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>

</html>
